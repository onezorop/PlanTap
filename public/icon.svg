<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F8EF7"/>
      <stop offset="100%" style="stop-color:#2D5BE3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6BA3FF"/>
      <stop offset="100%" style="stop-color:#4F8EF7"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>

  <!-- Inner shadow -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8"/>

  <!-- Checkmark/Tick in circle - representing "Plan" completion -->
  <circle cx="256" cy="220" r="90" fill="rgba(255,255,255,0.15)"/>

  <!-- Checkmark -->
  <path d="M200 220 L240 260 L320 180" fill="none" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tap indicator - concentric circles -->
  <circle cx="256" cy="340" r="60" fill="none" stroke="url(#accent)" stroke-width="8" opacity="0.8"/>
  <circle cx="256" cy="340" r="40" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.6"/>
  <circle cx="256" cy="340" r="20" fill="url(#accent)" opacity="0.9"/>

  <!-- "P" letter subtle watermark -->
  <text x="256" y="395" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="rgba(255,255,255,0.1)" text-anchor="middle">PT</text>
</svg>